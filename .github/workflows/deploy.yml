name: Déployer le site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  BUCKET: portfolio-noa
  DISTRIBUTION_ID: E3VGRIF45NWE2C
  AWS_REGION: eu-west-3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | sed 's/-/+/g; s/_/\//g' | base64 -d 2>/dev/null; echo

      - name: S'authentifier auprès d'AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::710165591195:role/github-deploy-portfolio
          aws-region: ${{ env.AWS_REGION }}

      - name: Envoyer les fichiers HTML
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*' --include '*.html' \
            --cache-control 'public, max-age=0, must-revalidate' \
            --content-type 'text/html; charset=utf-8'

      - name: Envoyer les autres fichiers
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*.html' \
            --cache-control 'public, max-age=86400'

      - name: Vider le cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*'