name: Déployer le site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  BUCKET: portfolio-noa
  DISTRIBUTION_ID: E3VGRIF45NWE2C
  AWS_REGION: eu-west-3

jobs:
  # Porte d'entrée : le même contrôle que sur les pull requests. Si le
  # site est incohérent (lien mort, sitemap désynchronisé, page d'erreur
  # renommée), rien n'est publié.
  verifier:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: S'authentifier auprès d'AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Envoyer les fichiers HTML
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*' --include '*.html' \
            --cache-control 'public, max-age=0, must-revalidate' \
            --content-type 'text/html; charset=utf-8'

      # Le CSS et le JS sont traités comme le HTML. Avec un cache d'un
      # jour, l'invalidation CloudFront vidait le cache du CDN mais pas
      # celui du visiteur : il recevait un HTML à jour et une feuille de
      # style périmée, donc une mise en page cassée jusqu'à 24 h.
      # Ici CloudFront cache toujours, mais le navigateur revalide à
      # chaque visite et reçoit un 304 tant que rien n'a changé.
      - name: Envoyer le CSS et le JS
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*' --include 'assets/*.css' --include 'assets/*.js' \
            --cache-control 'public, max-age=0, must-revalidate'

      # La police ne changera jamais : son contenu est figé et sa version
      # est dans son nom de fichier. Un an de cache navigateur, sans
      # revalidation (immutable), évite de refaire descendre 47 Ko à
      # chaque visiteur. Corollaire : pour changer de police, il faut
      # changer le nom du fichier, sinon les visiteurs gardent l'ancienne.
      - name: Envoyer les polices
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*' --include 'assets/fonts/*' \
            --cache-control 'public, max-age=31536000, immutable'

      # Images, sitemap, robots : ils changent rarement, un jour de cache
      # navigateur ne pose pas de problème.
      - name: Envoyer les autres fichiers
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*.html' \
            --exclude 'assets/*.css' --exclude 'assets/*.js' \
            --exclude 'assets/fonts/*' \
            --cache-control 'public, max-age=86400'

      # L'invalidation est lancée mais pas attendue : le rôle IAM ne
      # dispose que de cloudfront:CreateInvalidation. Attendre la fin
      # demanderait cloudfront:GetInvalidation (utilisé par le waiter),
      # à ajouter à la politique du rôle si le besoin se présente.
      - name: Vider le cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*'

      # Vérification des objets réellement stockés. On interroge S3 et non
      # l'URL publique : la restriction géographique de CloudFront renvoie
      # 403 aux runners GitHub, situés hors de la liste de pays autorisés.
      # Un test HTTP ne dirait donc pas « déployé » mais « bloqué ».
      #
      # `list-objects-v2` ne demande que s3:ListBucket, déjà accordé au
      # rôle. Il renvoie l'ETag et la taille de chaque objet. L'ETag d'un
      # upload en une partie (notre cas) est le MD5 du contenu : le
      # comparer au MD5 local prouve que le fichier en ligne est celui du
      # dépôt. Content-Type et Cache-Control demanderaient HeadObject,
      # donc s3:GetObject, volontairement non accordé.
      - name: Vérifier les objets publiés
        run: |
          set -euo pipefail

          declare -A etags tailles
          while IFS=$'\t' read -r cle etag taille; do
            etags["$cle"]="${etag//\"/}"
            tailles["$cle"]="$taille"
          done < <(aws s3api list-objects-v2 --bucket "$BUCKET" \
                     --query 'Contents[].[Key,ETag,Size]' --output text)

          verifier() {
            local cle="$1" attendu taille_attendue
            if [[ -z "${etags[$cle]:-}" ]]; then
              echo "::error file=site/$cle::$cle absent du bucket"
              return 1
            fi
            attendu=$(md5sum "site/$cle" | cut -d' ' -f1)
            taille_attendue=$(stat -c%s "site/$cle")
            if [[ "${etags[$cle]}" != "$attendu" ]]; then
              echo "::error file=site/$cle::$cle : contenu publié différent du dépôt (ETag ${etags[$cle]}, attendu $attendu)"
              return 1
            fi
            if [[ "${tailles[$cle]}" != "$taille_attendue" ]]; then
              echo "::error file=site/$cle::$cle : taille publiée ${tailles[$cle]} octets, attendue $taille_attendue"
              return 1
            fi
            echo "OK · $cle"
          }

          verifier index.html
          verifier error403.html
          verifier error404.html
          verifier projets/risk.html
          verifier assets/style.css
          verifier assets/site.js
          verifier assets/fonts/inter-v20-latin-var.woff2
          verifier og.png