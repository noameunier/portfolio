name: Déployer le site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  BUCKET: portfolio-noa
  DISTRIBUTION_ID: E3VGRIF45NWE2C
  AWS_REGION: eu-west-3

jobs:
  # Porte d'entrée : le même contrôle que sur les pull requests. Si le
  # site est incohérent (lien mort, sitemap désynchronisé, page d'erreur
  # renommée), rien n'est publié.
  verifier:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: S'authentifier auprès d'AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Envoyer les fichiers HTML
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*' --include '*.html' \
            --cache-control 'public, max-age=0, must-revalidate' \
            --content-type 'text/html; charset=utf-8'

      # Le CSS et le JS sont traités comme le HTML. Avec un cache d'un
      # jour, l'invalidation CloudFront vidait le cache du CDN mais pas
      # celui du visiteur : il recevait un HTML à jour et une feuille de
      # style périmée, donc une mise en page cassée jusqu'à 24 h.
      # Ici CloudFront cache toujours, mais le navigateur revalide à
      # chaque visite et reçoit un 304 tant que rien n'a changé.
      - name: Envoyer le CSS et le JS
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*' --include 'assets/*.css' --include 'assets/*.js' \
            --cache-control 'public, max-age=0, must-revalidate'

      # La police ne changera jamais : son contenu est figé et sa version
      # est dans son nom de fichier. Un an de cache navigateur, sans
      # revalidation (immutable), évite de refaire descendre 47 Ko à
      # chaque visiteur. Corollaire : pour changer de police, il faut
      # changer le nom du fichier, sinon les visiteurs gardent l'ancienne.
      - name: Envoyer les polices
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*' --include 'assets/fonts/*' \
            --cache-control 'public, max-age=31536000, immutable'

      # Images, sitemap, robots : ils changent rarement, un jour de cache
      # navigateur ne pose pas de problème.
      - name: Envoyer les autres fichiers
        run: |
          aws s3 sync site/ "s3://$BUCKET" \
            --delete \
            --exclude '*.html' \
            --exclude 'assets/*.css' --exclude 'assets/*.js' \
            --exclude 'assets/fonts/*' \
            --cache-control 'public, max-age=86400'

      - name: Vider le cache CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID créée, attente de sa fin…"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$ID"

      # Vérification des objets réellement stockés. On interroge S3 et non
      # l'URL publique : la restriction géographique de CloudFront renvoie
      # 403 aux runners GitHub, situés hors de la liste de pays autorisés.
      # Un test HTTP ne dirait donc pas « déployé » mais « bloqué ».
      #
      # L'ETag d'un objet S3 uploadé en une partie (notre cas) est le MD5
      # de son contenu : le comparer au MD5 local prouve que le fichier en
      # ligne est bien celui du dépôt, pas une version précédente.
      - name: Vérifier les objets publiés
        run: |
          set -euo pipefail

          verifier() {
            local cle="$1" cache_attendu="$2" type_attendu="${3:-}"
            local type cache etag attendu

            type=$(aws s3api head-object --bucket "$BUCKET" --key "$cle" \
              --query ContentType --output text)
            cache=$(aws s3api head-object --bucket "$BUCKET" --key "$cle" \
              --query CacheControl --output text)
            etag=$(aws s3api head-object --bucket "$BUCKET" --key "$cle" \
              --query ETag --output text | tr -d '"')
            attendu=$(md5sum "site/$cle" | cut -d' ' -f1)

            if [[ -n "$type_attendu" && "$type" != "$type_attendu" ]]; then
              echo "::error file=site/$cle::$cle : Content-Type « $type » au lieu de « $type_attendu »"
              return 1
            fi
            if [[ "$cache" != "$cache_attendu" ]]; then
              echo "::error file=site/$cle::$cle : Cache-Control « $cache » au lieu de « $cache_attendu »"
              return 1
            fi
            if [[ "$etag" != "$attendu" ]]; then
              echo "::error file=site/$cle::$cle : contenu publié différent du dépôt (ETag $etag, attendu $attendu)"
              return 1
            fi
            echo "OK · $cle"
          }

          verifier index.html 'public, max-age=0, must-revalidate' 'text/html; charset=utf-8'
          verifier error403.html 'public, max-age=0, must-revalidate' 'text/html; charset=utf-8'
          verifier error404.html 'public, max-age=0, must-revalidate' 'text/html; charset=utf-8'
          verifier projets/risk.html 'public, max-age=0, must-revalidate' 'text/html; charset=utf-8'
          verifier assets/style.css 'public, max-age=0, must-revalidate'
          verifier assets/site.js 'public, max-age=0, must-revalidate'
          verifier assets/fonts/inter-v20-latin-var.woff2 'public, max-age=31536000, immutable'
          verifier og.png 'public, max-age=86400'