<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cette page n'existe pas — Noa Meunier</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2308090c'/><text x='16' y='22' text-anchor='middle' font-family='system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' font-weight='600' letter-spacing='-1' fill='%23ffffff'>NM</text></svg>">
<!-- La police part en téléchargement en même temps que la feuille de style,
     au lieu d'attendre que le CSS soit analysé : la bascule depuis la police
     système devient invisible dans la plupart des cas. L'attribut crossorigin
     est obligatoire pour une police, même servie depuis le même domaine. -->
<link rel="preload" href="/assets/fonts/inter-v20-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/style.css">
<style>
  /* Page d'erreur : le contenu est centré, sans navigation ni pied de
     page. On garde le fond animé pour rester chez soi. */
  body { min-height: 100vh; display: grid; place-items: center; }
  main { max-width: 34rem; }
  main h1 { margin: .6rem 0 .75rem; font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
  main p { margin: 0 0 2rem; color: var(--muted); }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
</div>

<main class="wrap">
  <p class="label">Erreur 404</p>
  <h1>Cette page n'existe pas</h1>
  <p>L'adresse est peut-être mal orthographiée, ou la page a été retirée du site.</p>
  <a class="btn primary" href="/">Retour à l'accueil <span class="arrow" aria-hidden="true">→</span></a>
</main>

</body>
</html>
