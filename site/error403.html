<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Noa Meunier</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#171d1b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3.5' fill='%23171d1b'/><path d='M4.5 12V4l7 8V4' stroke='%239fd3e8' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<style>
:root {
  --bg:#171d1b; --surface:#1e2523; --line:#2e3835; --grid:#ffffff0d;
  --text:#e8ece6; --muted:#a5aea8; --accent:#9fd3e8; --mark:#9fd3e833;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --radius:8px;
}
*, *::before, *::after { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; padding:2rem 1.25rem;
  display:flex; align-items:center; justify-content:center;
  color:var(--text); font-family:var(--sans); font-size:1.0625rem; line-height:1.65;
  background-color:var(--bg);
  background-image:
    linear-gradient(to right,  var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
main { width:100%; max-width:32rem; }

/* Une grille 3×3 dont il manque une case : la page absente. */
.hole { display:grid; grid-template-columns:repeat(3,13px); gap:3px; margin-bottom:1.75rem; }
.hole i { display:block; aspect-ratio:1; border:1px solid var(--line); border-radius:2px; background:var(--accent); border-color:var(--accent); }
.hole i.gone { background:none; border-color:var(--line); border-style:dashed; }

.code { font-family:var(--mono); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 .6rem; }
h1 { margin:0 0 .75rem; font-size:clamp(1.7rem,6vw,2.3rem); font-weight:800; letter-spacing:-.025em; line-height:1.2; }
h1 span { background:linear-gradient(transparent 58%, var(--mark) 58%); padding:0 .2em .05em 0; }
p.lead { margin:0 0 1.75rem; color:var(--muted); }
a.home {
  display:inline-block; padding:.55rem 1rem;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  color:var(--accent); text-decoration:none; font-size:.9rem;
}
a.home:hover { border-color:var(--accent); }
a.home:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <div class="hole" aria-hidden="true">
    <i></i><i></i><i></i>
    <i></i><i class="gone"></i><i></i>
    <i></i><i></i><i></i>
  </div>
  <p class="code">Erreur 403</p>
  <h1><span>L'accès à cette page est interdit</span></h1>
  <p class="lead">Seul les utilisateurs en France peuvent voir cette page.</p>
  <a class="home" href="/">Retour à l'accueil</a>
</main>
</body>
</html>
